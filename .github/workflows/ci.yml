name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The gates render through SwiftShader here, which is minutes per frame. Measured on the run for
    # 15692d1, which four competing runs had slowed to about seven times local speed: animation 41 minutes,
    # nudge 16, everything else 9, so 66 for the suite. That run was cancelled at a 60-minute ceiling six
    # minutes short of the end, partway through nudge. Ninety is room under that contention, not an
    # expectation. The animation gate is the one to look at first if this ever needs trimming; it is the
    # largest share by far, and it is already down to three frames here.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The gates drive a headless chromium. Only chromium is needed, and --with-deps brings the system
      # libraries the runner does not ship.
      - run: npx playwright install --with-deps chromium

      # shot, compare, placement and animation. The runner has no GPU, so every render goes through
      # SwiftShader, which is what tools/lib/browser.js asks for anyway: the scored shot has always used
      # it so the numbers do not move with the graphics driver.
      #
      # npm run perf is deliberately NOT run here. It measures frame time on the machine it runs on, and
      # a shared runner without a GPU produces numbers unrelated to the budget in AGENTS.md; asserting
      # them would fail forever and tell nobody anything.
      # Three frames instead of seven: the animation gate shoots 1200x1100 through shadows and bloom on
      # a software renderer, which is minutes per frame on a shared runner. Three still spans the cycle.
      # Two of the blackframe gate's six size/ratio combinations, for the same reason: each one loads the
      # page and builds the scene again, and on SwiftShader that is minutes. The two kept are the size
      # the user's report came from (1280x720 at a device pixel ratio of 1.5) and the size every other
      # gate uses, and each is measured twice, on load and after a resize. The gate asks for the GPU and
      # will not get one here, so what it proves on this runner is that the chain is sound on SwiftShader;
      # the driver behaviour it was written for needs a machine with a GPU to see.
      - run: npm test
        env:
          ANIMATION_FRAMES: 3
          BLACKFRAME_VIEWS: 2

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: out/
          retention-days: 7
