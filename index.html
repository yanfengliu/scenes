<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyoto stepped street at sunset</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c24; }
  canvas#scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #reset {
    position: fixed; right: 12px; bottom: 12px;
    font: 13px/1.2 system-ui, sans-serif; color: #fff;
    background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  #reset:hover { background: rgba(0, 0, 0, 0.8); }
  #loading {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; justify-items: center;
    font: 14px/1.4 system-ui, sans-serif; color: #e8e3da; background: #1a1c24;
    transition: opacity 400ms ease; pointer-events: none;
  }
  #loading[hidden] { display: none; }
  #loading.done { opacity: 0; }
  #loading .bar { width: 160px; height: 3px; background: rgba(255, 255, 255, 0.18); overflow: hidden; border-radius: 2px; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: #e8c8b8; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) { #loading .bar i { animation: none; width: 100%; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script>
  // Handshake for the test tools: __sceneState leaves "loading" when the first frames are rendered
  // at the photo view (main.js calls __sceneResolve) or when anything throws (__sceneReject).
  window.__sceneState = 'loading';
  window.__sceneReady = new Promise((resolve, reject) => {
    window.__sceneResolve = (api) => { window.__sceneState = 'ready'; resolve(api); };
    window.__sceneReject = (err) => { window.__sceneState = 'error'; reject(err); };
  });
  window.__sceneReady.catch(() => {});
  // The indicator goes when the first frames are on screen, or turns into the error if they never come.
  window.__sceneReady.then(() => {
    const el = document.getElementById('loading');
    el.classList.add('done');
    setTimeout(() => { el.hidden = true; }, 450);
  }, (err) => {
    const el = document.getElementById('loading');
    el.textContent = `The scene failed to load: ${err && err.message ? err.message : err}`;
  });
  window.addEventListener('error', (e) => window.__sceneReject(e.error || new Error(e.message)));
  window.addEventListener('unhandledrejection', (e) => window.__sceneReject(e.reason));
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading"><div>Building the scene</div><div class="bar"><i></i></div></div>
<button id="reset" type="button" title="Reset to the photo view (R)">Reset view (R)</button>
<script type="module" src="./src/main.js" onerror="window.__sceneReject(new Error('the module script or one of its imports failed to load'))"></script>
</body>
</html>
